let activeCall=null,callTimers=[],callSeconds=0,callLineIndex=0,callConnected=false,callEnding=false;
let callLineAudio=null;
function stopCallLineAudio(){if(!callLineAudio)return;callLineAudio.onended=null;callLineAudio.onerror=null;callLineAudio.pause();callLineAudio.removeAttribute('src');callLineAudio.load();callLineAudio=null}
function clearCallTimers(){stopCallLineAudio();callTimers.forEach(clearTimeout);callTimers=[]}
function finishPhoneCall(){if(mode!=='phone'||sub!=='call'||!activeCall)return;const el=$('#callstatus');if(el)el.textContent='통화 종료됨';callTimers.push(setTimeout(()=>{if(mode==='phone'&&sub==='call'){clearCallTimers();activeCall=null;sub='root';phoneTab='recents';render()}},1300))}
// Only these xxx recordings exist. The other speaker has no audio files.
const xxxCallVoiceIndices=new Set([0,2,4,6]);
function callVoiceFile(index){
 if(!activeCall||!activeCall.lines?.[index])return '';
 // Sunwoo conversation has recordings for BOTH speakers, in transcript order.
 if(activeCall.id==='sunwoo')
  return 'sunwoo-'+String(index+1).padStart(2,'0')+'.m4a';
 // xxx and Youngjae calls only have Hyunjae's lines.
 if(activeCall.lines[index][0]!=='mine')return '';
 if(activeCall.id==='xxx'){
  if(!xxxCallVoiceIndices.has(index))return '';
  return 'xxx-'+String(index+1).padStart(2,'0')+'.m4a';
 }
 if(activeCall.id==='youngjae')
  return 'youngjae-'+String(index+1).padStart(2,'0')+'.mp3';
 return '';
}
function callVoiceStatus(index,label){
 const node=document.querySelector('[data-call-voice-status="'+index+'"]');
 if(node)node.textContent=label;
}
function playPhoneLineAudio(index,last){
 stopCallLineAudio();
 const call=activeCall;
 const file=callVoiceFile(index);
 if(!file){
  if(last)callTimers.push(setTimeout(finishPhoneCall,700));
  return;
 }
 // A Pages Direct Upload build may not yet have the uploaded audio asset.
 // Try its own directory first and GitHub Pages as the public fallback.
 const local=new URL('./call-audio/'+file,document.baseURI).href;
 const github='https://kimkik0808-cell.github.io/iphone-ios26/call-audio/'+encodeURIComponent(file);
 const sources=local===github?[local]:[local,github];
 let tried=0;
 let finished=false;
 const valid=()=>activeCall===call&&mode==='phone'&&sub==='call';
 function attempt(){
  if(!valid()||finished)return;
  const audio=new Audio();
  callLineAudio=audio;
  audio.preload='auto';
  audio.volume=1;
  audio.src=sources[tried];
  callVoiceStatus(index,'오디오 불러오는 중…');
  let failed=false;
  const fail=reason=>{
   if(failed||finished||callLineAudio!==audio||!valid())return;
   failed=true;
   audio.onended=null;audio.onerror=null;
   audio.pause();
   if(reason==='NotAllowedError'){
    callVoiceStatus(index,'▶ 버튼을 눌러 재생');
    return;
   }
   if(tried+1<sources.length){
    tried++;
    callVoiceStatus(index,'다른 주소로 다시 시도 중…');
    attempt();
    return;
   }
   callVoiceStatus(index,'음원 재생 불가 · ▶ 다시 시도');
   if(last){
    finished=true;
    callTimers.push(setTimeout(finishPhoneCall,850));
   }
  };
  audio.onplaying=()=>{if(valid()&&callLineAudio===audio)callVoiceStatus(index,'음성 재생 중 ♪')};
  audio.onended=()=>{
   if(finished||callLineAudio!==audio||!valid())return;
   finished=true;
   callVoiceStatus(index,'재생 완료 · ▶ 다시 듣기');
   if(last)finishPhoneCall();
  };
  audio.onerror=()=>fail('MediaError');
  try{
   const result=audio.play();
   if(result?.catch)result.catch(e=>fail(e?.name||'PlayError'));
  }catch(e){fail(e?.name||'PlayError')}
 }
 attempt();
}

function phoneDigits(v){return String(v||'').replace(/\D/g,'')}
function phoneDialCall(value){const digits=phoneDigits(value);return phoneCalls.find(x=>phoneDigits(x.number)===digits)||null}
function recordDialedCall(call){const i=phoneCalls.findIndex(x=>x.id===call.id);if(i>-1)phoneCalls.splice(i,1);const recent={...call,time:'방금',dir:'out',detail:'발신 통화'};phoneCalls.unshift(recent);return recent}
function startPhoneCall(call){clearCallTimers();activeCall=call;dial=call.number||call.name;callSeconds=0;callLineIndex=0;callConnected=false;callEnding=false;sub='call';render();startCallPlayback()}
function startCallPlayback(){if(mode!=='phone'||sub!=='call'||!activeCall)return;const status=$('#callstatus');if(!status)return;status.textContent='연결 중…';const connected=setTimeout(()=>{if(mode!=='phone'||sub!=='call')return;callConnected=true;status.textContent='00:00';const tick=setInterval(()=>{if(mode!=='phone'||sub!=='call'){clearInterval(tick);return}callSeconds++;const m=String(Math.floor(callSeconds/60)).padStart(2,'0'),s=String(callSeconds%60).padStart(2,'0');const el=$('#callstatus');if(el&&!callEnding)el.textContent=`${m}:${s}`},1000);callTimers.push(tick)},450);callTimers.push(connected)}
function advancePhoneCall(){
 if(mode!=='phone'||sub!=='call'||!activeCall||!callConnected||callEnding)return;
 const list=$('#calllines'),line=activeCall.lines[callLineIndex];if(!list||!line)return;
 const hint=$('#calltaphint'),wait=$('#callwait');if(hint)hint.remove();if(wait)wait.remove();
 const who=line[0]==='mine'?'나':activeCall.name;
 const voice=callVoiceFile(callLineIndex);
 const replay=voice?'<button type="button" class="call-voice-replay" data-call-audio-index="'+callLineIndex+'" aria-label="음성 다시 듣기">▶ 음성 재생</button><small class="call-voice-status" data-call-voice-status="'+callLineIndex+'"></small>':'';
 list.insertAdjacentHTML('beforeend',`<div class="call-line ${line[0]==='mine'?'mine':''}"><b>${escapeHTML(who)}</b>${escapeHTML(line[1])}${replay}</div>`);
 const index=callLineIndex++;
 const last=callLineIndex>=activeCall.lines.length;
 if(!last)list.insertAdjacentHTML('beforeend','<div class="call-wait" id="callwait"><i></i><i></i><i></i></div>');
 list.scrollTop=list.scrollHeight;
 if(last)callEnding=true;
 playPhoneLineAudio(index,last);
}

function messageHTML(m){const item=typeof m==='string'?{who:'other',text:m}:m;if(item.type==='system')return `<div class="ig14-systemline">${esc(igLanguage()==='zh'?(item.textZh||item.text):item.text)}</div>`;const mine=item.who==='mine',body=item.type==='reel'?reelMessage(item):item.type==='post'?sharedPost(item):`<div class="ig14-bubble">${esc(igLanguage()==='zh'?(item.textZh||item.text||''):(item.text||''))}</div>`;return `<div class="ig14-message ${mine?'mine':''}">${body}${item.time?`<small class="ig14-msgtime">${esc(item.time)}</small>`:''}</div>`}
function conversationHead(c){return `<div class="ig14-head">${b('back',ico('back'),'ig14-icon')}${b('contactprofile',def()+`<span><b>${esc(c.name)}</b><small>Instagram</small></span>`,'ig14-chathead-profile',`data-id="${c.id}"`)}<span class="ig14-grow"></span>${b('noop',ico('phone',23),'ig14-icon')}${b('noop',ico('video',24),'ig14-icon')}</div>`}
function conversation(cid,request=false){let c=request?fanRequests.find(x=>x.id===cid):privateChats.find(x=>x.id===cid),msgs=request?c.messages.map(text=>({who:'other',text})):state.messages[cid]||[],headHTML=request?head(esc(c.name),'',true):conversationHead(c);return `${headHTML}<div class="ig14-chat" id="ig14-chat">${msgs.length?msgs.map(messageHTML).join(''):'<div class="ig14-empty">아직 메시지가 없습니다</div>'}${!request&&aiTyping?'<div class="ig14-typing"><i></i><i></i><i></i></div>':''}${!request&&aiError?`<div class="ig14-aierror">${esc(aiError)}</div>`:''}</div>${request?'<div class="ig14-readonly">요청을 수락하지 않은 상태입니다</div>':`<form class="ig14-chatinput" data-chat="${cid}"><input placeholder="메시지 보내기..." autocomplete="off" maxlength="300"><button ${aiSending?'disabled':''}>전송</button></form>`}`}
function contactProfile(cid){let c=privateChats.find(x=>x.id===cid);if(!c)return inbox();return `${head(esc(c.name),'',true)}<main class="scroll"><div class="ig14-profiletop">${def('ig14-bigav')}<div class="ig14-stats"><span><b>0</b><small>게시물</small></span><span><b>${c.followers}</b><small>팔로워</small></span><span><b>${c.following}</b><small>팔로잉</small></span></div></div><div class="ig14-bio"><b>${esc(c.name)}</b><p>비공개 계정</p></div><div class="ig14-buttons"><button>팔로잉</button>${b('messagecontact','메시지','','data-id="'+c.id+'"')}</div><div class="ig14-profilenav two">${ico('grid')} ${ico('reel')}</div><div class="ig14-empty"><b>아직 게시물이 없습니다</b><span class="ig14-private-note">비공개 계정</span></div></main>`}
function reels(){let vids=videoUrls[acct()];if(!vids.length)return `${head('릴스',b('reeladd',ico('plus'),'ig14-icon'))}<div class="scroll"><div class="ig14-reelmsg"><div><b>릴스 동영상이 없습니다</b><p>${acct()==='public'?'공연·댄스·패션 동영상을':'일상·음식·반려동물 동영상을'} 기기에서 추가해 보세요.</p><label class="ig14-file">동영상 선택<input id="ig14-video" type="file" accept="video/*"></label></div></div></div>${tabs()}`;let v=vids[0];return `<div class="ig14-reels"><video src="${esc(v.url)}" autoplay muted loop playsinline controls></video><div class="ig14-reelcontrols"><b>${id()}</b><p>${esc(v.caption||'오늘의 릴스')}</p></div></div>${tabs()}`}
function search(){let users=acct()==='public'?Object.keys(teammate):privateFeed.map(x=>x.user);return `${head('검색')}<main class="scroll"><label class="ig14-search">${ico('search',20)}<input id="ig14-search" placeholder="검색"></label><div id="ig14-results">${users.map(u=>b('user',(acct()==='public'?av(teammate[u].avatar):def())+`<span class="ig14-rowtext"><b>${u}</b><small>${acct()==='public'?teammate[u].name:'추천 계정'}</small></span>`,'ig14-row',`data-id="${u}"`)).join('')}</div></main>${tabs()}`}
function detail(pid){let p=getPost(pid);return `${head('게시물','',true)}<main class="scroll">${post(p)}</main>`}
function comments(pid){let p=getPost(pid),arr=state.comments[acct()][pid]||[];return `${head('댓글','',true)}<div class="ig14-chat">${arr.map(x=>`<div class="ig14-bubble"><b>${id()}</b> ${esc(x)}</div>`).join('')||'<div class="ig14-empty">아직 댓글이 없습니다</div>'}</div><form class="ig14-chatinput" data-comment="${pid}"><input placeholder="댓글 달기..."><button>게시</button></form>`}
function create(kind='post'){draftKind=kind;return `${head(kind==='story'?'스토리 만들기':'새 게시물','',true)}<main class="scroll ig14-compose"><div class="ig14-preview" id="ig14-preview">${ico('camera',44)}</div><label class="ig14-file">사진 선택<input id="ig14-image" type="file" accept="image/*"></label>${kind==='post'?'<textarea id="ig14-caption" placeholder="문구를 입력하세요..."></textarea>':''}${b('publish','공유','ig14-primary')}</main>`}
function storyview(i){let s=state.stories[acct()][i];return `<div class="ig14-storyview">${img(s.data)}${b('back',ico('close',28),'ig14-storyclose')}<button class="ig14-storytap" data-a="back"></button></div>`}
const igLanguage=()=>window.IphoneLocale?.language==='zh'?'zh':'ko';
function igTime(){return new Intl.DateTimeFormat(igLanguage()==='zh'?'zh-CN':'ko-KR',{hour:'numeric',minute:'2-digit',hour12:true}).format(new Date())}
function aiFailure(error){let zh=igLanguage()==='zh',code=String(error?.message||'request_failed');let map={ai_not_configured:['Gemini尚未配置。','Gemini가 설정되지 않았습니다.'],quota_exceeded:['Gemini已达到额度限制，请稍后再试。','Gemini 요청 한도에 도달했습니다. 잠시 후 다시 시도해 주세요.'],upstream_timeout:['回复超时，请稍后再试。','답장 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.'],key_or_region_error:['Gemini密钥或地区设置有问题。','Gemini 키 또는 지역 설정을 확인해 주세요.']};return (map[code]||['暂时无法生成回复，请稍后再试。','답장을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'])[zh?0:1]}
async function requestIgReply(cid,userText){let endpoint=location.hostname==='nuyheaj.pages.dev'?'/api/kkt-reply':'https://nuyheaj.pages.dev/api/kkt-reply',messages=state.messages[cid]||[],history=messages.slice(0,-1).filter(m=>!['reel','post','system'].includes(m.type)&&m.text).slice(-12).map(m=>({role:m.who==='mine'?'user':'model',text:m.text})),controller=new AbortController;aiController=controller;let timer=setTimeout(()=>controller.abort(),36000);try{let response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chatId:cid,message:userText,history,language:igLanguage()}),signal:controller.signal}),result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'request_failed');if(!result.reply)throw Error('empty_reply');return String(result.reply).trim()}catch(error){if(controller.signal.aborted)throw Error('upstream_timeout');throw error}finally{clearTimeout(timer);if(aiController===controller)aiController=null}}
async function runIgReply(cid,userText){if(aiSending)return;aiSending=true;aiTyping=true;aiError='';render14();try{let reply=await requestIgReply(cid,userText);(state.messages[cid]||(state.messages[cid]=[])).push({who:'other',text:reply,time:igTime()});aiError='';persist()}catch(error){aiError=aiFailure(error)}finally{aiSending=false;aiTyping=false;if(mode==='instagram'&&view==='conversation'&&selected===cid)render14()}}
function render14(){if(typeof mode==='undefined'||mode!=='instagram')return;let f=document.querySelector('#appcontent');if(!f)return;document.querySelector('#app').classList.add('ig14-mode');let html;if(view==='accounts')html=accounts();else if(view==='requests')html=requests();else if(view==='conversation')html=conversation(selected,false);else if(view==='contact')html=contactProfile(selected);else if(view==='request')html=conversation(selected,true);else if(view==='detail')html=detail(selected);else if(view==='comments')html=comments(selected);else if(view==='create')html=create('post');else if(view==='storycreate')html=create('story');else if(view==='storyview')html=storyview(Number(selected));else if(view==='other')html=profile(selected);else html=({home,reels,inbox,search,profile}[state.activeTab]||home)();f.innerHTML=`<div id="ig14">${html}</div>`;if(view==='conversation'||view==='request')requestAnimationFrame(()=>{let chat=document.querySelector('#ig14-chat');if(chat)chat.scrollTop=chat.scrollHeight})}
function toast14(s){let r=document.querySelector('#ig14');if(!r)return;let t=document.createElement('div');t.className='ig14-toast';t.textContent=s;r.append(t);setTimeout(()=>t.remove(),1500)}
function rerenderKeepScroll(){let old=document.querySelector('#ig14 .scroll'),top=old?.scrollTop||0;render14();requestAnimationFrame(()=>{let next=document.querySelector('#ig14 .scroll');if(next)next.scrollTop=top})}
function toggle(key,pid,control){let a=list(key),i=a.indexOf(pid);i<0?a.push(pid):a.splice(i,1);persist();let active=a.includes(pid);if(key==='likes'&&control){control.innerHTML=ico('heart',27,active);control.classList.toggle('ig14-liked',active);let count=control.closest('.ig14-post')?.querySelector('.ig14-meta>b'),p=getPost(pid);if(count&&p)count.textContent=`좋아요 ${cnt((p.likes||0)+(active?1:0))}개`;return}rerenderKeepScroll()}
function action(e){if(mode!=='instagram')return;let x=e.target.closest('[data-a]');if(!x)return;e.preventDefault();e.stopImmediatePropagation();let a=x.dataset.a,v=x.dataset.v,pid=x.dataset.id;if(a==='tab'){state.activeTab=v;view='';persist();render14()}else if(a==='back'){if(view==='detail'&&sharedPostReturn){selected=sharedPostReturn;sharedPostReturn='';view='conversation'}else if(view==='contact'&&contactReturn==='conversation'){view='conversation';contactReturn=''}else view='';render14()}else if(a==='accounts'){view='accounts';render14()}else if(a==='switch'){state.account=v;state.activeTab='profile';view='';persist();render14()}else if(a==='like')toggle('likes',pid,x);else if(a==='save')toggle('saved',pid,x);else if(a==='prev'||a==='next'){let p=getPost(pid);slide[pid]=Math.max(0,Math.min(p.photos.length-1,(slide[pid]||0)+(a==='next'?1:-1)));rerenderKeepScroll()}else if(a==='user'){if(teammate[pid]){selected=pid;view='other';render14()}}else if(a==='contactprofile'){contactReturn=view==='conversation'?'conversation':'';selected=pid;view='contact';render14()}else if(a==='messagecontact'){selected=pid;view='conversation';contactReturn='';render14()}else if(a==='sharedpost'){sharedPostReturn=selected;selected=pid;view='detail';render14()}else if(a==='detail'){sharedPostReturn='';selected=pid;view='detail';render14()}else if(a==='comments'){selected=pid;view='comments';render14()}else if(a==='requests'){view='requests';render14()}else if(a==='request'){selected=pid;view='request';render14()}else if(a==='chat'){selected=pid;view='conversation';aiError='';render14()}else if(a==='opencreate'){view='create';render14()}else if(a==='storycreate'){view='storycreate';render14()}else if(a==='storyview'){selected=pid;view='storyview';render14()}else if(a==='publish'){if(!draftMedia)return toast14('사진을 먼저 선택하세요');if(draftKind==='story')state.stories[acct()].push({data:draftMedia,time:Date.now()});else{let cap=document.querySelector('#ig14-caption')?.value.trim()||'';state.use function compress(file,cb){let rd=new FileReader;rd.onload=()=>{let im=new Image;im.onload=()=>{let scale=Math.min(1,1080/im.width,1350/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=rd.result};rd.readAsDataURL(file)}
const content=document.querySelector('#appcontent');content.addEventListener('click',action,true);content.addEventListener('change',e=>{if(mode!=='instagram')return;if(e.target.id==='ig14-image'){let f=e.target.files?.[0];if(f)compress(f,d=>{draftMedia=d;let p=document.querySelector('#ig14-preview');if(p)p.innerHTML=img(d)})}if(e.target.id==='ig14-video'){let f=e.target.files?.[0];if(f){videoUrls[acct()].unshift({url:URL.createObjectURL(f),caption:f.name});render14()}}},true);content.addEventListener('submit',e=>{if(mode!=='instagram')return;let form=e.target;if(!form.matches('[data-chat],[data-comment]'))return;e.preventDefault();e.stopImmediatePropagation();let inp=form.querySelector('input'),s=inp.value.trim();if(!s)return;if(form.dataset.chat){let cid=form.dataset.chat;if(aiSending)return;(state.messages[cid]||(state.messages[cid]=[])).push({who:'mine',text:s,time:igTime()});persist();inp.value='';render14();runIgReply(cid,s)}else{let p=form.dataset.comment;(state.comments[acct()][p]||(state.comments[acct()][p]=[])).push(s);persist();render14()}},true);
content.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});content.addEventListener('touchend',e=>{if(mode!=='instagram')return;let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY,p=e.target.closest('.ig14-photo');if(p&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){let po=getPost(p.dataset.post);slide[po.id]=Math.max(0,Math.min(po.photos.length-1,(slide[po.id]||0)+(dx<0?1:-1)));render14()}},{passive:true});
const baseRender=render,baseBack=back;render=function(){baseRender();if(mode==='instagram'){view='';render14()}};back=function(){if(mode==='instagram'){if(view){view='';render14()}else if(state.activeTab!=='home'){state.activeTab='home';render14()}else baseBack()}else baseBack()};
window.__IG14_TEST__={get state(){return state},ownPosts,teammate,privateFeed,fanRequests,privateChats,render:render14};
if(mode==='instagram')render14();
})();

</script>
