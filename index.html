 <div class="ig6-actions">${btn('like',ico('heart',27,likes.has(p.id)),'ig6-action '+(likes.has(p.id)?'ig6-liked':''),`data-id="${p.id}"`)}${btn('comments',ico('comment',26),'ig6-action',`data-id="${p.id}"`)}${btn('share',ico('dm',27),'ig6-action',`data-id="${p.id}"`)}<span class="ig6-flex"></span>${btn('bookmark',ico('bookmark',26,bookmarks.has(p.id)),'ig6-action',`data-id="${p.id}"`)}</div>

}
