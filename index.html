async function loadPhotoManifest(force=false){if(photosLoading||photosLoaded&&!force)return;photosLoading=true;photosError='';if(mode==='photos')render();try{const r=await fetch(`photos/manifest.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(String(r.status));const data=await r.json(),items=normalizePhotos(data.photos);if(items.length)photoManifest=items;photosLoaded=true}catch(e){photosError='사진 목록을 새로 불러오지 못했습니다.';photosLoaded=true}finally{photosLoading=false;if(mode==='photos')render()}}
function visiblePhotos(){return photoAlbum==='favorites'?photoManifest.filter(p=>photoFavorites.has(p.id)):photoManifest}
function photoLabel(p){return p?.date||''}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300)}
function showPin(){pin='';$('#passcode').classList.add('active');updatePin()}function updatePin(){$('#pin-dots').innerHTML=Array.from({length:6},(_,i)=>`<i class="pin-dot ${i<pin.length?'filled':''}"></i>`).join('')}function lockOff(){isLocked=false;$('#lock').classList.add('hide');$('#passcode').classList.remove('active');$('#home').classList.remove('hide');$('#status').classList.remove('dark');$('#gesture').classList.remove('ink')}
$('#numpad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(x=>x===''?'<i class="number blank"></i>':`<button class="number" data-digit="${x}">${x}</button>`).join('');$('#pin-dots').innerHTML='<i class="pin-dot"></i>'.repeat(6);
$('#numpad').addEventListener('click',e=>{const b=e.target.closest('[data-digit]');if(!b)return;pin+=b.dataset.digit;updatePin();if(pin.length===6){if(pin==='000000')setTimeout(lockOff,200);else{toast('암호가 틀렸습니다 (데모 암호: 000000)');setTimeout(()=>{pin='';updatePin()},320)}}});
$('#passcode').addEventListener('click',e=>{if(e.target.closest('[data-pin-cancel]'))$('#passcode').classList.remove('active');if(e.target.closest('[data-pin-del]')){pin=pin.slice(0,-1);updatePin()}});
let touchStart=null;$('#lock').addEventListener('touchstart',e=>{touchStart=e.touches[0].clientY},{passive:true});$('#lock').addEventListener('touchend',e=>{if(touchStart!==null&&touchStart-e.changedTouches[0].clientY>45)showPin();touchStart=null},{passive:true});$('#lock').addEventListener('click',e=>{if(e.target.closest('#flashlight'))toast('손전등 데모');else if(e.target.closest('#camera'))toast('카메라 데모');else showPin()});
const appEl=$('#app'),frame=$('#appcontent');function closeApp(){clearCallTimers();activeCall=null;mode='home';sub='root';appEl.className='layer appscreen';appEl.style.display='none';$('#status').classList.remove('dark');$('#gesture').classList.remove('ink')}
function openApp(n){if(isLocked){showPin();return}mode=n;sub='root';appEl.className='layer appscreen active';appEl.style.display='block';render();if(n==='photos')loadPhotoManifest()}
$('#device').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b&&!e.target.closest('#app'))openApp(b.dataset.open)});
$('#homesearch').addEventListener('click',()=>toast('검색 기능은 다음 버전에서 추가됩니다'));
$('#gesture').addEventListener('click',()=>{if(isLocked)showPin();else if(mode!=='home')closeApp()});let gestureY=null;$('#gesture').addEventListener('touchstart',e=>gestureY=e.touches[0].clientY,{passive:true});$('#gesture').addEventListener('touchend',e=>{if(gestureY!==null){if(isLocked)showPin();else if(mode!=='home')closeApp()}gestureY=null},{passive:true});
function nav(name,back='',right=''){return `<div class="appnav"><button class="navback" data-back>‹ ${escapeHTML(back)}</button><div class="smallhead">${escapeHTML(name)}</div><button class="navright" data-right>${right}</button></div>`}
function tabs(items,active){return `<div class="ios-tabs">${items.map(([key,ico,label])=>`<button data-tab="${key}" class="${active===key?'selected':''}"><span style="font-size:23px;line-height:1">${ico}</span><span>${label}</span></button>`).join('')}</div>`}
function listMessages(data){return data.map(x=>`<button class="ios-row ${mode==='messages'?'sms-row':''} ${x.unread?'unread':''} ${x.risk?'risk':''}" data-chat="${(mode==='kakao'?kakaoChats:texts).indexOf(x)}">${mode==='messages'&&x.unread?'<i class="sms-dot"></i>':''}<span class="avatar" ${x.color?`style="background:${x.color}"`:''}>${escapeHTML(x.initial)}</span><div class="ios-main"><strong>${escapeHTML(x.name)}</strong><p>${escapeHTML(x.preview)}</p></div><small>${escapeHTML(x.time)}${mode==='messages'?'<b>›</b>':''}</small></button>`).join('')}
function chatPage(kakao){const x=(kakao?kakaoChats:texts)[currentThread];return `<div class="chathead"><button class="chatback" data-back>‹ 뒤로</button><div class="chattitle">${escapeHTML(x.name)}</div><button class="navright" data-more>•••</button></div><div class="chat-scroller ${kakao?'kakao-chat':''}"><div class="chatbody" id="chatbody">${x.chat.map(([side,t])=>`<div class="bubble ${side==='mine'?'mine':''}">${escapeHTML(t)}</div>`).join('')}</div></div><form class="chatfooter" id="chatform"><input id="chatinput" placeholder="${kakao?'메시지 입력':'문자 메시지'}" autocomplete="off"><button aria-label="전송">↑</button></form>`}
function calendarPage(){const n=new Date();const k=koParts(n);let y=+k.year,m=+k.month+calOffset;y+=Math.floor((m-1)/12);m=(m-1)%12;if(m<0)m+=12;m++;let first=new Date(Date.UTC(y,m-1,1)).getUTCDay();let days=new Date(Date.UTC(y,m,0)).getUTCDate();let nprev=new Date(Date.UTC(y,m-1,0)).getUTCDate();const dates=Array.from({length:42},(_,i)=>{let d=i-first+1,dim=d<1||d>days,actual=d<1?nprev+d:d>days?d-days:d;let today=!dim&&+k.year===y&&+k.month===m&&+k.day===d;return `<button class="calcell ${dim?'dim':''} ${today?'today':''} ${selectedDay===d&&!dim?'chosen':''}" data-day="${!dim?d:''}">${actual}</button>`}).join('');return nav('캘린더','','오늘')+`<div class="monthheader"><span>${y}년 ${m}월</span><div><button data-month="-1">‹</button><button data-month="1">›</button></div></div><div class="weekdays">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-days">${dates}</div><div style="border-top:1px solid #e3e3e8;margin-top:20px;padding:18px 23px;font-size:15px">${selectedDay?`${m}월 ${selectedDay}일`:'오늘'}<p style="color:#9a9aa2;font-size:14px">예정된 이벤트 없음</p></div>`}
function phoneRecentRows(){return phoneCalls.map(x=>`<button class="phone-row ${x.dir==='missed'?'missed':''}" data-phone-call="${x.id}"><span class="call-kind">${x.dir==='out'?'↗':x.dir==='missed'?'↙':'↘'}</span><span class="call-main"><strong>${escapeHTML(x.name)}</strong><p>${escapeHTML(x.detail)}</p></span><time>${escapeHTML(x.time)}</time><span class="info">ⓘ</span></button>`).join('')}
function phoneContactRows(q=''){const filtered=phoneContacts.filter(x=>x.name.includes(q)||x.group.includes(q));return ['멤버','회사','가족','친구'].map(group=>{const rows=filtered.filter(x=>x.group===group);if(!rows.length)return'';return `<div class="phone-section">${group}</div><div class="phone-list">${rows.map(x=>`<button class="phone-row" data-phone-contact="${escapeHTML(x.name)}"><span class="contact-avatar" style="background:${x.color}">${escapeHTML(x.name.slice(0,1))}</span><span class="call-main"><strong>${escapeHTML(x.name)}</strong><p>${escapeHTML(x.number)}</p></span><span class="contact-chevron">›</span></button>`).join('')}</div>`}).join('')||'<div class="phone-empty"><b>검색 결과 없음</b><span>일치하는 연락처가 없습니다.</span></div>'}
function phonePage(){const menu=[['favorites','★','즐겨찾기'],['recents','◷','최근 통화'],['contacts','♟','연락처'],['keypad','▦','키패드'],['voicemail','◉','음성 사서함']];let body='';if(phoneTab==='keypad'){body=`<div class="dial-display">${escapeHTML(dial)||' '}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'*',0,'#'].map(k=>`<button class="dial-key" data-dial="${k}">${k}</button>`).join('')}</div><button class="call-btn" data-call aria-label="통화"><svg width="33" height="33" viewBox="0 0 24 24" fill="white"><path d="M6 2c-2 0-4 3-4 6 0 7 8 15 15 15 3 0 6-2 6-4 0-1-6-6-8-5l-3 3c-3-1-5-4-6-6l3-3C10 6 7 2 6 2z"/></svg></button>`}else if(phoneTab==='recents')body=`<div class="large-title">최근 통화</div><div class="phone-segment"><span>전체</span></div><div class="phone-list">${phoneRecentRows()}</div>`;else if(phoneTab==='contacts')body=`<div class="large-title">연락처</div><div class="ios-search">⌕ <input id="phonecontactsearch" placeholder="검색" autocomplete="off"></div><div id="phonecontacts">${phoneContactRows()}</div>`;else if(phoneTab==='favorites')body=`<div class="large-title">즐겨찾기</div><div class="phone-list">${['엄마','매니저 형','xxx'].map(name=>{const c=phoneContacts.find(x=>x.name===name);return `<button class="phone-row" data-phone-contact="${name}"><span class="contact-avatar" style="background:${c.color}">${name[0]}</span><span class="call-main"><strong>${name}</strong><p>휴대전화</p></span><span class="contact-chevron">›</span></button>`}).join('')}</div>`;else body=`<div class="large-title">음성 사서함</div><div class="phone-empty"><i>◉</i><b>음성 메시지 없음</b><span>새로운 음성 메시지가 없습니다.</span></div>`;return `${nav('전화','','편집')}<div class="phone-scroll">${body}</div>${tabs(menu,phoneTab)}`}
function callPage(){const c=activeCall||phoneContactCall(dial||'알 수 없음');return `<div class="call-screen"><div class="call-person"><div class="call-label">휴대전화</div><h1>${escapeHTML(c.name)}</h1><p id="callstatus">연결 중…</p></div><div class="call-transcript" id="calllines"><h2>통화 내용</h2><div class="call-tap-hint" id="calltaphint"><span><i>☝︎</i>화면을 누르면 다음 대화가 표시됩니다.</span></div></div><div class="call-actions">${[['⌁','음소거'],['⌨','키패드'],['◖))','스피커'],['＋','통화 추가'],['◉','FaceTime'],['♟','연락처']].map(x=>`<div class="call-action"><i>${x[0]}</i>${x[1]}</div>`).join('')}</div><button class="hang-btn" data-hang aria-label="통화 종료"><svg width="31" height="31" viewBox="0 0 24 24" fill="white"><path d="M6 2c-2 0-4 3-4 6 0 7 8 15 15 15 3 0 6-2 6-4 0-1-6-6-8-5l-3 3c-3-1-5-4-6-6l3-3C10 6 7 2 6 2z"/></svg></button></div>`}
function messagesPage(kakao){if(sub==='chat')return chatPage(kakao);return nav(kakao?'채팅':'메시지','',kakao?'✎':'↻')+`<div class="large-title">${kakao?'채팅':'메시지'}${kakao?'':`<span class="sms-count">${texts.length}</span>`}</div><div class="ios-search">⌕ <input id="threadquery" placeholder="검색"></div>${kakao?'':'<div class="sms-filter"><span>모든 메시지</span><span>알 수 없는 발신자</span><span>읽지 않음</span></div>'}<div class="ios-list ${kakao?'':'sms-list'}" id="threadlist">${listMessages(kakao?kakaoChats:texts)}</div>${kakao?tabs([['friends','♟','친구'],['chats','▤','채팅'],['open','◉','오픈채팅'],['more','•••','더보기']],'chats'):''}`}
function safariPage(){return `<div class="safari-page"><div class="large-title">시작 페이지</div><div class="safari-section-head"><b>즐겨찾기</b></div><div class="safari-favorites">${[['NAVER','N'],['Google','G'],['YouTube','▶'],['Apple','●']].map(([n,icon])=>`<button class="safari-fav" data-fav="${n}"><i>${icon}</i>${n}</button>`).join('')}</div><div class="safari-section-head"><b>최근 검색</b><span>${safariHistory.length}개</span></div><div class="safari-history">${safariHistory.map(x=>`<button class="safari-history-row" data-safari-query="${escapeHTML(x.q)}"><i>⌕</i><span>${escapeHTML(x.q)}</span><small>${escapeHTML(x.time)}</small></button>`).join('')}</div><div class="safari-section-head"><b>개인정보 보호 보고서</b></div><div class="safari-privacy"><i>🛡</i><div><b>개인정보 보호가 켜져 있습니다.</b><p>Safari가 사용자의 브라우징 활동을 보호하고 있습니다.</p></div></div></div><div class="urlbar"><span style="font-size:22px;color:#007aff">‹</span><form id="safariform"><span style="color:#777">ᴀᴀ&nbsp;</span><input id="safariaddress" placeholder="검색어 또는 웹 사이트 이름 입력" autocomplete="off"><button>↗</button></form><span style="font-size:22px;color:#007aff">▢</span></div>`}
function musicPage(){return nav('지금 재생 중','음악','•••')+`<div class="music-cover">♫</div><div class="music-info"><div><strong>Midnight Walk</strong><p>Demo Playlist</p></div><span style="font-size:27px">♡</span></div><div class="music-line"><span></span></div><div style="display:flex;justify-content:space-between;margin:0 35px;color:#9d9ea9;font-size:11px"><span>0:35</span><span>-2:10</span></div><div class="music-controls"><button data-prev>⏮</button><button data-play>${playing?'Ⅱ':'▶'}</button><button data-next>⏭</button></div><p style="text-align:center;color:#9d9fa9;font-size:12px">음악 재생 화면 데모</p>`}
function photoTabs(){return `<div class="ph-tabs">${[['library','▦','사진'],['memories','◉','추억'],['shared','♧','공유'],['albums','▤','앨범']].map(([k,i,l])=>`<button data-ph-tab="${k}" class="${photoTab===k?'active':''}"><i>${i}</i><span>${l}</span></button>`).join('')}</div>`}
function photoGrid(items){if(!items.length)return `<div class="ph-status"><div><div class="ph-empty-fav">♡</div><b>${photoAlbum==='favorites'?'즐겨찾기 없음':'사진 없음'}</b><span>${photoAlbum==='favorites'?'하트를 누른 사진이 여기에 표시됩니다.':'photos 폴더에 사진을 추가해 주세요.'}</span></div></div>`;return `<div class="ph-grid">${items.map(p=>`<button class="ph-tile ${photoSelected.has(p.id)?'selected':''}" data-photo-id="${escapeHTML(p.id)}" aria-label="${escapeHTML(p.name)}"><img src="${escapeHTML(p.src)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('is-error')">${photoSelectMode?`<i class="ph-check">${photoSelected.has(p.id)?'✓':''}</i>`:''}</button>`).join('')}</div>`}
function photoLibrary(){const items=visiblePhotos();return `<div class="ph-page"><div class="ph-top"><h1>${photoAlbum==='favorites'?'즐겨찾기':'사진'}</h1><div class="ph-top-actions"><button class="ph-circle" data-photo-reload aria-label="새로 고침">↻</button><button class="ph-pill" data-photo-select>${photoSelectMode?'완료':'선택'}</button></div></div>${photoSelectMode?`<div class="ph-selection">${photoSelected.size?`${photoSelected.size}장 선택됨`:'사진 선택'}</div>`:''}<div class="ph-scroll"><div class="ph-subhead"><strong>${photoAlbum==='favorites'?'즐겨찾기':'최근 항목'}</strong><small>${items.length}장</small></div>${photosLoading?'<div class="ph-status"><div><div class="ph-loader"></div><span>사진을 불러오는 중…</span></div></div>':photoGrid(items)}${photosError?`<div class="ph-refresh-note">${photosError} 기존 사진을 표시합니다.</div>`:''}</div>${photoTabs()}</div>`}
function photoAlbums(){const cover=photoManifest[0],fav=photoManifest.find(p=>photoFavorites.has(p.id));return `<div class="ph-page"><div class="ph-top"><h1>앨범</h1><div class="ph-top-actions"><button class="ph-circle" data-photo-reload aria-label="새로 고침">↻</button></div></div><div class="ph-scroll"><div class="ph-subhead"><strong>내 앨범</strong><small>전체 보기</small></div><div class="ph-albums"><div class="ph-album-grid"><button class="ph-album" data-photo-album="all"><div class="ph-album-cover">${cover?`<img src="${escapeHTML(cover.src)}" alt="">`:'▦'}</div><b>최근 항목</b><small>${photoManifest.length}장</small></button><button class="ph-album" data-photo-album="favorites"><div class="ph-album-cover">${fav?`<img src="${escapeHTML(fav.src)}" alt="">`:'♡'}</div><b>즐겨찾기</b><small>${photoFavorites.size}장</small></button></div></div></div>${photoTabs()}</div>`}
function photoPlaceholder(title,body,icon){return `<div class="ph-page"><div class="ph-top"><h1>${title}</h1></div><div class="ph-scroll"><div class="ph-status"><div><div class="ph-empty-fav">${icon}</div><b>${title}</b><span>${body}</span></div></div></div>${photoTabs()}</div>`}
function photoDetail(){const p=photoManifest[photoIndex];if(!p){sub='root';return photoLibrary()}const fav=photoFavorites.has(p.id);return `<div class="ph-detail"><div class="ph-detail-top"><button data-photo-back aria-label="뒤로">‹</button><div class="ph-detail-title"><b>사진</b>${photoLabel(p)?`<small>${escapeHTML(photoLabel(p))}</small>`:''}</div><button data-photo-close aria-label="닫기">×</button></div><div class="ph-stage"><img src="${escapeHTML(p.src)}" alt="${escapeHTML(p.name)}" draggable="false" style="transform:scale(${photoScale})" onerror="this.parentElement.classList.add('is-error')"></div><div class="ph-detail-bottom"><button data-photo-fav class="${fav?'on':''}" aria-label="즐겨찾기">${fav?'♥':'♡'}</button><span class="ph-counter">${photoIndex+1} / ${photoManifest.length}</span><button data-photo-info aria-label="정보">ⓘ</button></div></div>`}
function photosPage(){if(sub==='photo')return photoDetail();if(photoTab==='albums')return photoAlbums();if(photoTab==='memories')return photoPlaceholder('추억','표시할 추억이 아직 없습니다.','◉');if(photoTab==='shared')return photoPlaceholder('공유','공유된 사진이 없습니다.','♧');return photoLibrary()}
function notesPage(){if(sub==='edit')return nav('메모','메모','완료')+`<textarea id="noteedit" class="note-edit" placeholder="메모를 입력하세요">${escapeHTML(notes[noteIndex]||'')}</textarea>`;return nav('메모','','✎')+`<div class="large-title">메모</div><div class="ios-search">⌕ <input id="notesearch" placeholder="검색"/></div><div class="ios-list" id="noteslist">${noteRows()}</div>`}

function reels(){let vids=videoUrls[acct()];if(!vids.length)return `${head('릴스',b('reeladd',ico('plus'),'ig14-icon'))}<div class="scroll"><div class="ig14-reelmsg"><div><b>릴스 동영상이 없습니다</b><p>${acct()==='public'?'공연·댄스·패션 동영상을':'일상·음식·반려동물 동영상을'} 기기에서 추가해 보세요.</p><label class="ig14-file">동영상 선택<input id="ig14-video" type="file" accept="video/*"></label></div></div></div>${tabs()}`;let v=vids[0];return `<div class="ig14-reels"><video src="${esc(v.url)}" autoplay muted loop playsinline controls></video><div class="ig14-reelcontrols"><b>${id()}</b><p>${esc(v.caption||'오늘의 릴스')}</p></div></div>${tabs()}`}
function search(){let users=acct()==='public'?Object.keys(teammate):privateFeed.map(x=>x.user);return `${head('검색')}<main class="scroll"><label class="ig14-search">${ico('search',20)}<input id="ig14-search" placeholder="검색"></label><div id="ig14-results">${users.map(u=>b('user',(acct()==='public'?av(teammate[u].avatar):def())+`<span class="ig14-rowtext"><b>${u}</b><small>${acct()==='public'?teammate[u].name:'추천 계정'}</small></span>`,'ig14-row',`data-id="${u}"`)).join('')}</div></main>${tabs()}`}
function detail(pid){let p=getPost(pid);return `${head('게시물','',true)}<main class="scroll">${post(p)}</main>`}
function comments(pid){let p=getPost(pid),arr=state.comments[acct()][pid]||[];return `${head('댓글','',true)}<div class="ig14-chat">${arr.map(x=>`<div class="ig14-bubble"><b>${id()}</b> ${esc(x)}</div>`).join('')||'<div class="ig14-empty">아직 댓글이 없습니다</div>'}</div><form class="ig14-chatinput" data-comment="${pid}"><input placeholder="댓글 달기..."><button>게시</button></form>`}
function create(kind='post'){draftKind=kind;return `${head(kind==='story'?'스토리 만들기':'새 게시물','',true)}<main class="scroll ig14-compose"><div class="ig14-preview" id="ig14-preview">${ico('camera',44)}</div><label class="ig14-file">사진 선택<input id="ig14-image" type="file" accept="image/*"></label>${kind==='post'?'<textarea id="ig14-caption" placeholder="문구를 입력하세요..."></textarea>':''}${b('publish','공유','ig14-primary')}</main>`}
function storyview(i){let s=state.stories[acct()][i];return `<div class="ig14-storyview">${img(s.data)}${b('back',ico('close',28),'ig14-storyclose')}<button class="ig14-storytap" data-a="back"></button></div>`}
function render14(){if(typeof mode==='undefined'||mode!=='instagram')return;let f=document.querySelector('#appcontent');if(!f)return;document.querySelector('#app').classList.add('ig14-mode');let html;if(view==='accounts')html=accounts();else if(view==='requests')html=requests();else if(view==='conversation')html=conversation(selected,false);else if(view==='request')html=conversation(selected,true);else if(view==='detail')html=detail(selected);else if(view==='comments')html=comments(selected);else if(view==='create')html=create('post');else if(view==='storycreate')html=create('story');else if(view==='storyview')html=storyview(Number(selected));else if(view==='other')html=profile(selected);else html=({home,reels,inbox,search,profile}[state.activeTab]||home)();f.innerHTML=`<div id="ig14">${html}</div>`}
function toast14(s){let r=document.querySelector('#ig14');if(!r)return;let t=document.createElement('div');t.className='ig14-toast';t.textContent=s;r.append(t);setTimeout(()=>t.remove(),1500)}
function toggle(key,pid){let a=list(key),i=a.indexOf(pid);i<0?a.push(pid):a.splice(i,1);persist();render14()}
function action(e){if(mode!=='instagram')return;let x=e.target.closest('[data-a]');if(!x)return;e.preventDefault();e.stopImmediatePropagation();let a=x.dataset.a,v=x.dataset.v,pid=x.dataset.id;if(a==='tab'){state.activeTab=v;view='';persist();render14()}else if(a==='back'){view='';render14()}else if(a==='accounts'){view='accounts';render14()}else if(a==='switch'){state.account=v;state.activeTab='profile';view='';persist();render14()}else if(a==='like')toggle('likes',pid);else if(a==='save')toggle('saved',pid);else if(a==='prev'||a==='next'){let p=getPost(pid);slide[pid]=Math.max(0,Math.min(p.photos.length-1,(slide[pid]||0)+(a==='next'?1:-1)));render14()}else if(a==='user'){if(teammate[pid]){selected=pid;view='other';render14()}}else if(a==='detail'){selected=pid;view='detail';render14()}else if(a==='comments'){selected=pid;view='comments';render14()}else if(a==='requests'){view='requests';render14()}else if(a==='request'){selected=pid;view='request';render14()}else if(a==='chat'){selected=pid;view='conversation';render14()}else if(a==='opencreate'){view='create';render14()}else if(a==='storycreate'){view='storycreate';render14()}else if(a==='storyview'){selected=pid;view='storyview';render14()}else if(a==='publish'){if(!draftMedia)return toast14('사진을 먼저 선택하세요');if(draftKind==='story')state.stories[acct()].push({data:draftMedia,time:Date.now()});else{let cap=document.querySelector('#ig14-caption')?.value.trim()||'';state.userPosts[acct()].unshift({id:'u'+Date.now(),user:id(),avatar:acct()==='public'?'jh_avatar':null,photos:[draftMedia],caption:cap,likes:0,comments:0,time:'방금'});}draftMedia='';persist();view='';state.activeTab=draftKind==='story'?'home':'profile';render14()}}
function compress(file,cb){let rd=new FileReader;rd.onload=()=>{let im=new Image;im.onload=()=>{let scale=Math.min(1,1080/im.width,1350/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=rd.result};rd.readAsDataURL(file)}
const content=document.querySelector('#appcontent');content.addEventListener('click',action,true);content.addEventListener('change',e=>{if(mode!=='instagram')return;if(e.target.id==='ig14-image'){let f=e.target.files?.[0];if(f)compress(f,d=>{draftMedia=d;let p=document.querySelector('#ig14-preview');if(p)p.innerHTML=img(d)})}if(e.target.id==='ig14-video'){let f=e.target.files?.[0];if(f){videoUrls[acct()].unshift({url:URL.createObjectURL(f),caption:f.name});render14()}}},true);content.addEventListener('submit',e=>{if(mode!=='instagram')return;let form=e.target;if(!form.matches('[data-chat],[data-comment]'))return;e.preventDefault();e.stopImmediatePropagation();let inp=form.querySelector('input'),s=inp.value.trim();if(!s)return;if(form.dataset.chat){state.messages[form.dataset.chat].push({who:'mine',text:s})}else{let p=form.dataset.comment;(state.comments[acct()][p]||(state.comments[acct()][p]=[])).push(s)}persist();render14()},true);
content.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});content.addEventListener('touchend',e=>{if(mode!=='instagram')return;let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY,p=e.target.closest('.ig14-photo');if(p&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){let po=getPost(p.dataset.post);slide[po.id]=Math.max(0,Math.min(po.photos.length-1,(slide[po.id]||0)+(dx<0?1:-1)));render14()}},{passive:true});
const baseRender=render,baseBack=back;render=function(){baseRender();if(mode==='instagram'){view='';render14()}};back=function(){if(mode==='instagram'){if(view){view='';render14()}else if(state.activeTab!=='home'){state.activeTab='home';render14()}else baseBack()}else baseBack()};
window.__IG14_TEST__={get state(){return state},ownPosts,teammate,privateFeed,fanRequests,privateChats,render:render14};
if(mode==='instagram')render14();
})();

function keyboardHTML15(){let rows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['⇧','ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','⌫']];return `<div class="k15-keyboard">${rows.map((r,i)=>`<div class="k15-keyrow">${r.map(k=>`<button type="button" class="k15-key ${i===2&&(k==='⇧'||k==='⌫')?'wide':''}" data-k15="key" data-key="${k}">${k}</button>`).join('')}</div>`).join('')}<div class="k15-keyrow"><button type="button" class="k15-key wide" data-key="123">123</button><button type="button" class="k15-key space" data-key="space">간격</button><button type="button" class="k15-key wide" data-key="입력">입력</button></div></div>`}
function room15(){let x=data15.find(c=>c.id===chat15);if(!x){view15='';return chats15()}let group=x.members>1;return `<section class="k15-chatroom">${head15(x.name,true,group?x.members:'')}<main class="k15-chatbody ${keyboard15?'keyboard':''}" id="k15-chatbody">${x.type==='risk'?`<div class="k15-riskbox"><b>주의가 필요한 대화</b>상대가 숙소 위치 등 사적인 동선을 언급했습니다. 답장하지 말고 매니저에게 공유한 뒤 신고·차단하는 설정입니다.<div class="k15-riskbuttons"><button data-k15="report">매니저에게 공유</button><button data-k15="block">신고 및 차단</button></div></div>`:''}${x.messages.map(m=>{if(m[0]==='date')return `<div class="k15-date"><span>${esc15(m[1])}</span></div>`;let mine=m[0]==='mine',sender=m[3]||x.name;return `<div class="k15-message ${mine?'mine':''}">${!mine?avatar15({id:sender,name:sender}):''}<div class="k15-msgstack">${!mine&&group?`<div class="k15-sender">${esc15(sender)}</div>`:''}<div class="k15-bubbleline"><div class="k15-bubble">${esc15(m[1])}</div><span class="k15-msgmeta">${mine&&m[4]==='unread'?'<i class="k15-read">1</i>':''}<time>${esc15(m[2]||'방금')}</time></span></div></div></div>`}).join('')}${typing15?`<div class="k15-message">${avatar15({id:x.id,name:x.name})}<div class="k15-msgstack"><div class="k15-typing"><i></i><i></i><i></i></div></div></div>`:''}${blocked15&&x.type==='risk'?'<div class="k15-notice">이 계정을 차단했습니다. 더 이상 메시지를 받을 수 없습니다.</div>':''}</main>${blocked15&&x.type==='risk'?'':`<form class="k15-input ${keyboard15?'keyboard':''}" id="k15-form"><button type="button" class="k15-plus" data-k15="attach">＋</button><label class="k15-inputbox"><input id="k15-input" data-k15="compose" readonly value="${esc15(draft15)}" placeholder="메시지를 입력하세요"><button class="k15-send ${draft15&&draft15===x.scriptReply?'ready':''}">↑</button></label></form>${keyboard15?keyboardHTML15():''}`}</section>`}
function keyParts15(ch){if(!ch)return [];if(ch===' ')return ['space'];let n=ch.charCodeAt(0)-44032;if(!Number.isFinite(n)||n<0||n>11171)return [];let first=['ㄱ','ㄱ','ㄴ','ㄷ','ㄷ','ㄹ','ㅁ','ㅂ','ㅂ','ㅅ','ㅅ','ㅇ','ㅈ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],vowel=[['ㅏ'],['ㅐ'],['ㅑ'],['ㅒ'],['ㅓ'],['ㅔ'],['ㅕ'],['ㅖ'],['ㅗ'],['ㅗ','ㅏ'],['ㅗ','ㅐ'],['ㅗ','ㅣ'],['ㅛ'],['ㅜ'],['ㅜ','ㅓ'],['ㅜ','ㅔ'],['ㅜ','ㅣ'],['ㅠ'],['ㅡ'],['ㅡ','ㅣ'],['ㅣ']],last=['','ㄱ','ㄱ','ㄱ','ㄴ','ㄴ','ㄴ','ㄷ','ㄹ','ㄹ','ㄹ','ㄹ','ㄹ','ㄹ','ㄹ','ㅁ','ㅂ','ㅂ','ㅅ','ㅅ','ㅅ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];let f=Math.floor(n/588),v=Math.floor(n%588/28),l=n%28;return [first[f],...vowel[v],...(last[l]?[last[l]]:[])]}
function typeFixed15(){let x=data15.find(c=>c.id===chat15);if(!x?.scriptReply||x.scriptDone)return;clearTimeout(typeTimer15);keyboard15=true;draft15='';render15();let chars=Array.from(x.scriptReply),ci=0,ki=0,parts=keyParts15(chars[0]||'');function next(){if(ci>=chars.length){document.querySelector('.k15-send')?.classList.add('ready');return}let ch=chars[ci],key=parts[ki],btn=key?document.querySelector(`.k15-key[data-key="${key}"]`):null;if(btn)btn.classList.add('pressed');typeTimer15=setTimeout(()=>{btn?.classList.remove('pressed');ki++;if(ki>=parts.length){draft15+=ch;let input=document.querySelector('#k15-input');if(input)input.value=draft15;ci++;ki=0;parts=keyParts15(chars[ci]||'');typeTimer15=setTimeout(next,parts.length?28:45)}else typeTimer15=setTimeout(next,18)},key?48:40)}next()}
function render15(){if(typeof mode==='undefined'||mode!=='kakao')return;document.querySelector('#app').classList.add('kkt15-mode');let html=view15==='room'?room15():tab15==='friends'?friends15():tab15==='open'?open15():tab15==='shop'?shop15():tab15==='more'?more15():chats15();S.innerHTML=`<div id="kkt15">${html}</div>`;requestAnimationFrame(()=>{let b=document.querySelector('#k15-chatbody');if(b)b.scrollTop=b.scrollHeight})}
