function chatPage(kakao){const x=(kakao?kakaoChats:texts)[currentThread];return `<div class="chathead"><button class="chatback" data-back>‹ 뒤로</button><div class="chattitle">${escapeHTML(x.name)}</div><button class="navright" data-more>•••</button></div><div class="chat-scroller ${kakao?'kakao-chat':''}"><div class="chatbody" id="chatbody">${x.chat.map(([side,t])=>`<div class="bubble ${side==='mine'?'mine':''}">${escapeHTML(t)}</div>`).join('')}</div></div><form class="chatfooter" id="chatform"><input id="chatinput" placeholder="${kakao?'메시지 입력':'문자 메시지'}" autocomplete="off"><button aria-label="전송">↑</button></form>`}
function calendarPage(){const n=new Date();const k=koParts(n);let y=+k.year,m=+k.month+calOffset;y+=Math.floor((m-1)/12);m=(m-1)%12;if(m<0)m+=12;m++;let first=new Date(Date.UTC(y,m-1,1)).getUTCDay();let days=new Date(Date.UTC(y,m,0)).getUTCDate();let nprev=new Date(Date.UTC(y,m-1,0)).getUTCDate();const dates=Array.from({length:42},(_,i)=>{let d=i-first+1,dim=d<1||d>days,actual=d<1?nprev+d:d>days?d-days:d;let today=!dim&&+k.year===y&&+k.month===m&&+k.day===d;return `<button class="calcell ${dim?'dim':''} ${today?'today':''} ${selectedDay===d&&!dim?'chosen':''}" data-day="${!dim?d:''}">${actual}</button>`}).join('');return nav('캘린더','','오늘')+`<div class="monthheader"><span>${y}년 ${m}월</span><div><button data-month="-1">‹</button><button data-month="1">›</button></div></div><div class="weekdays">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-days">${dates}</div><div style="border-top:1px solid #e3e3e8;margin-top:20px;padding:18px 23px;font-size:15px">${selectedDay?`${m}월 ${selectedDay}일`:'오늘'}<p style="color:#9a9aa2;font-size:14px">예정된 이벤트 없음</p></div>`}
function phonePage(){const menu=[['favorites','★','즐겨찾기'],['recents','◷','최근 통화'],['contacts','♟','연락처'],['keypad','▦','키패드'],['voicemail','◉','음성 사서함']];let body='';if(phoneTab==='keypad'){body=`<div class="dial-display">${escapeHTML(dial)||' '}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'*',0,'#'].map(k=>`<button class="dial-key" data-dial="${k}">${k}</button>`).join('')}</div><button class="call-btn" data-call><svg width="33" height="33" viewBox="0 0 24 24" fill="white"><path d="M6 2c-2 0-4 3-4 6 0 7 8 15 15 15 3 0 6-2 6-4 0-1-6-6-8-5l-3 3c-3-1-5-4-6-6l3-3C10 6 7 2 6 2z"/></svg></button>`}else if(phoneTab==='recents')body=`<div class="large-title">최근 통화</div><div class="ios-list">${[['지민','오늘'],['서연','어제'],['알 수 없음','월요일']].map(x=>`<button class="ios-row" data-contact="${x[0]}"><div class="ios-main"><strong>${x[0]}</strong><p>휴대전화</p></div><small>${x[1]}</small></button>`).join('')}</div>`;else if(phoneTab==='contacts')body=`<div class="large-title">연락처</div><div class="ios-search">⌕ <input placeholder="검색"/></div><div class="ios-list">${[['지민','010-1234-5678'],['서연','010-2468-1357'],['민지','010-4321-5678']].map(x=>`<button class="ios-row" data-contact="${x[0]}"><div class="ios-main"><strong>${x[0]}</strong><p>${x[1]}</p></div>›</button>`).join('')}</div>`;else body=`<div class="large-title">${phoneTab==='favorites'?'즐겨찾기':'음성 사서함'}</div><div class="tinylabel">저장된 항목이 없습니다.</div>`;return `${nav('전화','','편집')}<div style="position:absolute;inset:calc(var(--safe-top) + 110px) 0 calc(var(--safe-bottom) + 95px);overflow:auto">${body}</div>${tabs(menu,phoneTab)}`}
function callPage(){return `<div style="background:linear-gradient(150deg,#606a79,#161820);position:absolute;inset:0;color:white;text-align:center;padding-top:90px"><div style="font-size:32px">${escapeHTML(dial||'통화')}</div><p>통화 중 · 데모</p><button data-hang style="position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#ff3b30;border-radius:100%;width:74px;height:74px;color:#fff;font-size:27px">☎</button></div>`}
function messagesPage(kakao){if(sub==='chat')return chatPage(kakao);return nav(kakao?'채팅':'메시지','','✎')+`<div class="large-title">${kakao?'채팅':'메시지'}</div><div class="ios-search">⌕ <input id="threadquery" placeholder="검색"></div><div class="ios-list" id="threadlist">${listMessages(kakao?kakaoChats:texts)}</div>${kakao?tabs([['friends','♟','친구'],['chats','▤','채팅'],['open','◉','오픈채팅'],['more','•••','더보기']],'chats'):''}`}
function safariPage(){return `<div style="padding-top:8px"><div class="large-title">시작 페이지</div><div style="font-weight:680;margin:25px 20px 15px;font-size:21px">즐겨찾기</div><div class="safari-favorites">${[['Apple','●'],['Google','G'],['YouTube','▶'],['뉴스','▦']].map(([n,icon])=>`<button class="safari-fav" data-fav="${n}"><i>${icon}</i>${n}</button>`).join('')}</div><div style="font-weight:690;font-size:20px;margin:35px 20px 12px">개인정보 보호 보고서</div><div class="safari-top" style="font-size:14px">Safari가 개인정보를 안전하게 보호합니다.<p style="color:#92929c;font-size:12px">오프라인 웹 시뮬레이터입니다.</p></div><div id="safariresult"></div></div><div class="urlbar"><span style="font-size:22px;color:#007aff">‹</span><form id="safariform"><span style="color:#777">ᴀᴀ&nbsp;</span><input id="safariaddress" placeholder="검색어 또는 웹 사이트 이름 입력" autocomplete="off"><button>↗</button></form><span style="font-size:22px;color:#007aff">▢</span></div>`}
function musicPage(){return nav('지금 재생 중','음악','•••')+`<div class="music-cover">♫</div><div class="music-info"><div><strong>Midnight Walk</strong><p>Demo Playlist</p></div><span style="font-size:27px">♡</span></div><div class="music-line"><span></span></div><div style="display:flex;justify-content:space-between;margin:0 35px;color:#9d9ea9;font-size:11px"><span>0:35</span><span>-2:10</span></div><div class="music-controls"><button data-prev>⏮</button><button data-play>${playing?'Ⅱ':'▶'}</button><button data-next>⏭</button></div><p style="text-align:center;color:#9d9fa9;font-size:12px">음악 재생 화면 데모</p>`}
function photosPage(){if(sub==='photo')return nav('사진','보관함','공유')+`<div class="photo-full" style="background-image:${photoColors[photoIndex]};height:80%;margin-top:15px"></div>`;return nav('사진','','선택')+`<div class="large-title">보관함</div><div class="tinylabel">샘플 이미지 · ${photoColors.length}장</div><div class="tile-grid">${photoColors.map((bg,i)=>`<button class="photo-tile" style="background-image:${bg}" data-photo="${i}" aria-label="사진 ${i+1}"></button>`).join('')}</div>${tabs([['library','▦','보관함'],['albums','▤','앨범'],['search','⌕','검색']],'library')}`}
function notesPage(){if(sub==='edit')return nav('메모','메모','완료')+`<textarea id="noteedit" class="note-edit" placeholder="메모를 입력하세요">${escapeHTML(notes[noteIndex]||'')}</textarea>`;return nav('메모','','✎')+`<div class="large-title">메모</div><div class="ios-search">⌕ <input id="notesearch" placeholder="검색"/></div><div class="ios-list" id="noteslist">${noteRows()}</div>`}
function noteRows(q=''){return notes.map((v,i)=>({v,i})).filter(x=>x.v.includes(q)).map(({v,i})=>`<button class="ios-row" data-note="${i}"><div class="ios-main"><strong>${escapeHTML(v.split('\n')[0]||'새 메모')}</strong><p>${escapeHTML(v.split('\n').slice(1).join(' ')||'추가 텍스트 없음')}</p></div><span style="color:#bbb">›</span></button>`).join('')||'<div class="tinylabel">메모가 없습니다.</div>'}
function youtubePage(){return `<div class="yt-top"><div class="yt-logo"><span style="background:#ff0033;color:#fff;border-radius:6px;padding:0 5px;font-size:18px">▶</span> YouTube</div><button style="background:none;font-size:21px" data-ytsearch>⌕</button></div><div style="display:flex;gap:7px;padding:0 13px 12px">${['전체','음악','라이브','게임','여행'].map((s,i)=>`<span style="background:${i===0?'#151515':'#f1f1f1'};color:${i===0?'#fff':'#111'};padding:7px 13px;border-radius:8px;font-size:13px">${s}</span>`).join('')}</div>${[['서울의 하루','daily seoul','11:48'],['주말의 플레이리스트','playlist','25:12'],['부산 여행 브이로그','travel diary','08:20']].map(([title,user,t],i)=>`<button style="background:none;width:100%;padding:0;border:0;text-align:left;color:inherit" data-video="${i}"><div class="video-thumb" style="background:${photoColors[i]}"><span>▶</span><span style="position:absolute;right:12px;bottom:10px;background:#000b;color:white;padding:3px 6px;border-radius:4px;font-size:12px">${t}</span></div><div class="video-meta"><span class="avatar">${i+1}</span><div><strong>${title}</strong><p>${user} · 조회수 1.2만회</p></div></div></button>`).join('')}${tabs([['home','⌂','홈'],['shorts','▶','Shorts'],['subs','▣','구독'],['you','◉','나']],'home')}`}
function instagramPage(){return `<div class="ig-top"><span style="font-family:Georgia;font-style:italic;font-size:27px">Instagram</span><span style="font-size:25px">♡　✉</span></div><div class="ig-stories">${['내 스토리','minji','seoyeon','today','travel'].map((n,i)=>`<div class="ig-story"><i><span>${n[0].toUpperCase()}</span></i>${n}</div>`).join('')}</div><div style="display:flex;align-items:center;padding:11px 15px;gap:9px"><span class="avatar" style="width:33px;height:33px;font-size:14px">S</span><b style="font-size:14px">seoul.days</b><span style="margin-left:auto">•••</span></div><div class="ig-pic">✦</div><div style="font-size:27px;padding:12px 16px"><button data-like style="background:none;color:${liked?'#ef345b':'#161616'};font-size:26px">${liked?'♥':'♡'}</button>　♡　↗</div><div style="font-size:13px;padding:0 20px"><b>좋아요 ${liked?'2':'1'}개</b><p><b>seoul.days</b> 오늘의 기록 ☁️</p></div>${tabs([['home','⌂','홈'],['search','⌕','검색'],['reels','▶','릴스'],['profile','◎','프로필']],'home')}`}
function render(){let d=(mode==='kakao'||mode==='youtube'||mode==='instagram'||mode==='music')?'black':mode==='safari'||mode==='messages'||mode==='photos'?'white':mode==='notes'?'white':'';if(mode==='kakao')d='kakao-bg';if(mode==='music')d='music-bg';appEl.className='layer appscreen active '+d;$('#status').classList.toggle('dark',d!=='black'&&d!=='music-bg');$('#gesture').classList.toggle('ink',d!=='black'&&d!=='music-bg');frame.style.bottom=(mode==='safari'||sub==='chat')?'calc(var(--safe-bottom) + 75px)':'calc(var(--safe-bottom) + 28px)';frame.style.overflow=(mode==='calendar'||mode==='safari'||mode==='notes'||mode==='music'||mode==='phone'||mode==='messages'||mode==='kakao')?'hidden':'auto';let page=mode==='calendar'?calendarPage():mode==='phone'?(sub==='call'?callPage():phonePage()):mode==='messages'?messagesPage(false):mode==='kakao'?messagesPage(true):mode==='safari'?safariPage():mode==='music'?musicPage():mode==='photos'?photosPage():mode==='notes'?notesPage():mode==='youtube'?youtubePage():instagramPage();frame.innerHTML=page;if(sub==='chat'){let sc=frame.querySelector('.chat-scroller');if(sc)sc.scrollTop=sc.scrollHeight}}
function persist(){try{localStorage.setItem('iphone_demo_notes',JSON.stringify(notes))}catch{}}
function back(){if(sub==='edit'){notes[noteIndex]=$('#noteedit')?.value||'';persist();sub='root';render();return}if(sub!=='root'){sub='root';render();return}closeApp()}
frame.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('back' in d){back();return}if('right' in d){if(mode==='notes'){if(sub==='edit'){notes[noteIndex]=$('#noteedit')?.value||'';persist();sub='root'}else{notes.unshift('');noteIndex=0;sub='edit'}render()}else if(mode==='calendar'){calOffset=0;selectedDay=0;render()}else toast('추후 추가될 기능입니다');return}if('tab' in d){if(mode==='phone'){phoneTab=d.tab;render()}else toast('이 탭은 다음 버전에서 구현됩니다');return}if('chat' in d){currentThread=+d.chat;sub='chat';render();return}if('month' in d){calOffset+=+d.month;selectedDay=0;render();return}if('day' in d){selectedDay=+d.day;render();return}if('dial' in d){dial+=d.dial;render();return}if('call' in d){if(dial){sub='call';render()}else toast('번호를 입력하세요');return}if('hang' in d){sub='root';render();return}if('contact' in d){dial=d.contact;sub='call';render();return}if('note' in d){noteIndex=+d.note;sub='edit';render();return}if('photo' in d){photoIndex=+d.photo;sub='photo';render();return}if('play' in d){playing=!playing;render();return}if('like' in d){liked=!liked;render();return}if('video' in d){toast('영상은 시연용입니다');return}if('fav' in d||'ytsearch' in d||'prev' in d||'next' in d||'more' in d){toast('현재는 화면 시연용입니다')}});
frame.addEventListener('input',e=>{if(e.target.id==='threadquery'){$('#threadlist').innerHTML=listMessages((mode==='kakao'?kakaoChats:texts).filter(x=>x.name.includes(e.target.value)||x.preview.includes(e.target.value)))}if(e.target.id==='notesearch'){$('#noteslist').innerHTML=noteRows(e.target.value)}});
frame.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chatform'){let field=$('#chatinput'),text=field.value.trim();if(!text)return;let data=mode==='kakao'?kakaoChats:texts;data[currentThread].chat.push(['mine',text]);data[currentThread].preview=text;render()}if(e.target.id==='safariform'){let q=$('#safariaddress').value.trim();if(q){$('#safariresult').innerHTML=`<div class="safari-top">${escapeHTML(q)}<p style="color:#92929c">인터넷 연결 없는 미리보기입니다.</p></div>`;toast('검색 미리보기')}}});
let sx=null,sy=null;appEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});appEl.addEventListener('touchend',e=>{if(sx!==null&&sx<30&&e.changedTouches[0].clientX-sx>110&&Math.abs(e.changedTouches[0].clientY-sy)<65)back();sx=sy=null},{passive:true});
// Show the lock screen first; the home view is hidden until a six-digit demo passcode is entered.
$('#home').classList.add('hide');
</script></body></html>
