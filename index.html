let activeCall=null,callTimers=[],callSeconds=0,callLineIndex=0,callConnected=false,callEnding=false;
let callLineAudio=null;
function stopCallLineAudio(){if(!callLineAudio)return;callLineAudio.onended=null;callLineAudio.onerror=null;callLineAudio.pause();callLineAudio.removeAttribute('src');callLineAudio.load();callLineAudio=null}
function clearCallTimers(){stopCallLineAudio();window.__IPHONE_SOUND__?.stopRingtone?.();callTimers.forEach(clearTimeout);callTimers=[]}
function finishPhoneCall(){if(mode!=='phone'||sub!=='call'||!activeCall)return;const el=$('#callstatus');if(el)el.textContent=phoneT('통화 종료됨','通话已结束');callTimers.push(setTimeout(()=>{if(mode==='phone'&&sub==='call'){clearCallTimers();activeCall=null;sub='root';phoneTab='recents';render()}},1300))}
// Only these xxx recordings exist. The other speaker has no audio files.
const xxxCallVoiceIndices=new Set([0,2,4,6]);
function callVoiceFile(index){
 if(!activeCall||!activeCall.lines?.[index])return '';
 if(activeCall.audioPrefix){
  const ext=activeCall.audioExt||'m4a';
  return activeCall.audioPrefix+'-'+String(index+1).padStart(2,'0')+'.'+ext;
 }
 // Sunwoo conversation has recordings for BOTH speakers, in transcript order.
 if(activeCall.id==='sunwoo')
  return 'sunwoo-'+String(index+1).padStart(2,'0')+'.m4a';
 // xxx and Youngjae calls only have Hyunjae's lines.
 if(activeCall.lines[index][0]!=='mine')return '';
 if(activeCall.id==='xxx'){
  if(!xxxCallVoiceIndices.has(index))return '';
  return 'xxx-'+String(index+1).padStart(2,'0')+'.m4a';
 }
 if(activeCall.id==='youngjae')
  return 'youngjae-'+String(index+1).padStart(2,'0')+'.mp3';
 return '';
}
function callVoiceStatus(index,label){
 const node=document.querySelector('[data-call-voice-status="'+index+'"]');
 if(node)node.textContent=label;
}
function playPhoneLineAudio(index,last){
 stopCallLineAudio();
 const call=activeCall;
 const file=callVoiceFile(index);
 if(!file){
  if(last)callTimers.push(setTimeout(finishPhoneCall,700));
  return;
 }
 // A Pages Direct Upload build may not yet have the uploaded audio asset.
 // Try its own directory first and GitHub Pages as the public fallback.
 const local=new URL('./call-audio/'+file,document.baseURI).href;
 const github='https://kimkik0808-cell.github.io/iphone-ios26/call-audio/'+encodeURIComponent(file);
 const sources=local===github?[local]:[local,github];
 let tried=0;
 let finished=false;
 const valid=()=>activeCall===call&&mode==='phone'&&sub==='call';
 function attempt(){
  if(!valid()||finished)return;
  const audio=new Audio();
  callLineAudio=audio;
  audio.preload='auto';
  audio.volume=1;
  audio.src=sources[tried];
  callVoiceStatus(index,phoneT('오디오 불러오는 중…','正在载入音频…'));
  let failed=false;
  const fail=reason=>{
   if(failed||finished||callLineAudio!==audio||!valid())return;
   failed=true;
   audio.onended=null;audio.onerror=null;
   audio.pause();
   if(reason==='NotAllowedError'){
    callVoiceStatus(index,phoneT('▶ 버튼을 눌러 재생','点击▶播放'));
    return;
   }
   if(tried+1<sources.length){
    tried++;
    callVoiceStatus(index,phoneT('다른 주소로 다시 시도 중…','正在尝试其他地址…'));
    attempt();
    return;
   }
   callVoiceStatus(index,phoneT('음원 재생 불가 · ▶ 다시 시도','无法播放音频 · 点击▶重试'));
   if(last){
    finished=true;
    callTimers.push(setTimeout(finishPhoneCall,850));
   }
  };
  audio.onplaying=()=>{if(valid()&&callLineAudio===audio)callVoiceStatus(index,phoneT('음성 재생 중 ♪','正在播放语音 ♪'))};
  audio.onended=()=>{
   if(finished||callLineAudio!==audio||!valid())return;
   finished=true;
   callVoiceStatus(index,phoneT('재생 완료 · ▶ 다시 듣기','播放结束 · 点击▶重听'));
   if(last)finishPhoneCall();
  };
  audio.onerror=()=>fail('MediaError');
  try{
   const result=audio.play();
   if(result?.catch)result.catch(e=>fail(e?.name||'PlayError'));
  }catch(e){fail(e?.name||'PlayError')}
 }
 attempt();
}

function startCallPlayback(){if(mode!=='phone'||sub!=='call'||!activeCall)return;const status=$('#callstatus');if(!status)return;status.textContent=phoneT('연결 중…','正在连接…');const connected=setTimeout(()=>{if(mode!=='phone'||sub!=='call')return;callConnected=true;status.textContent='00:00';const tick=setInterval(()=>{if(mode!=='phone'||sub!=='call'){clearInterval(tick);return}callSeconds++;const m=String(Math.floor(callSeconds/60)).padStart(2,'0'),s=String(callSeconds%60).padStart(2,'0');const el=$('#callstatus');if(el&&!callEnding)el.textContent=`${m}:${s}`},1000);callTimers.push(tick)},450);callTimers.push(connected)}
function advancePhoneCall(){
 if(mode!=='phone'||sub!=='call'||!activeCall||!callConnected||callEnding)return;
 const list=$('#calllines'),line=activeCall.lines[callLineIndex];if(!list||!line)return;
 const hint=$('#calltaphint'),wait=$('#callwait');if(hint)hint.remove();if(wait)wait.remove();
